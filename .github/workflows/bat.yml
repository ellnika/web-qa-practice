name: build acceptance tests

on:
  push:
  pull_request:

env:
  JUICE_SHOP_VERSION: 20.4.0
  JUICE_SHOP_DIR: ${{ github.workspace }}/../juice-shop

jobs:
  bat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The app under test: the official ready-built Juice Shop release, checked against its MD5 checksum.
      - name: Download Juice Shop ${{ env.JUICE_SHOP_VERSION }}
        run: |
          base=https://github.com/juice-shop/juice-shop/releases/download/v${JUICE_SHOP_VERSION}
          file=juice-shop-${JUICE_SHOP_VERSION}_node24_linux_x64.tgz
          curl -sSfL -o "$RUNNER_TEMP/$file" "$base/$file"
          curl -sSfL -o "$RUNNER_TEMP/$file.md5" "$base/$file.md5"
          echo "$(cut -d' ' -f1 "$RUNNER_TEMP/$file.md5")  $RUNNER_TEMP/$file" | md5sum -c -
          mkdir -p "$JUICE_SHOP_DIR"
          tar -xzf "$RUNNER_TEMP/$file" -C "$JUICE_SHOP_DIR" --strip-components=1

      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Playwright starts Juice Shop itself (webServer in playwright.config.ts) and waits until it answers.
      - name: Run build acceptance tests
        run: npx playwright test

      - name: Upload report (screenshots and traces of failures)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
